name: Tich Connect identity
on:
  pull_request:
    branches: [tich/main]
  push:
    branches: [tich/main]
permissions:
  contents: read
jobs:
  identity:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Verify app and extension identity
        run: |
          python3 - <<'PY'
          import pathlib, plistlib, struct
          root = pathlib.Path('.')
          config = (root / 'app.yml').read_text()
          for setting in ['APP_DISPLAY_NAME: Tich Connect', 'BASE_BUNDLE_IDENTIFIER: app.tich.connect',
                          'APP_GROUP_IDENTIFIER: group.app.tich.connect']:
              assert setting in config, setting
          for target in ['ElementX', 'NSE', 'ShareExtension']:
              data = plistlib.loads((root / target / 'SupportingFiles' / (target + '.entitlements')).read_bytes())
              assert data['com.apple.security.application-groups'] == ['$(APP_GROUP_IDENTIFIER)']
          icon = (root / 'ElementX/Resources/AppIcon.icon/Assets/AppIcon.png').read_bytes()
          assert icon[:8] == b'\x89PNG\r\n\x1a\n'
          assert struct.unpack('>II', icon[16:24]) == (1024, 1024)
          PY
      - name: Reproduce brand assets
        run: |
          swift Tools/Scripts/tich-brand.swift
          # PDF metadata contains creation time; the raster icon is deterministic.
          git diff --exit-code -- ElementX/Resources/AppIcon.icon/Assets/AppIcon.png
